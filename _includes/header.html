{% assign t = site.data.i18n[page.lang] %}
<a class="skip-link" href="#content">{{ t.skip }}</a>
<header class="site-header">
  <a class="brand" href="{% if page.lang == 'en' %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}" aria-label="{{ t.brand_label }}">MAD DUCK</a>
  <div class="descriptor">INDEPENDENT<br>ENGINEERING<br>WORKSHOP</div>
  <nav class="site-nav" id="site-nav" aria-label="{{ t.nav_label }}">
    <a href="{% if page.lang == 'en' %}{{ '/en/#projects' | relative_url }}{% else %}{{ '/#projects' | relative_url }}{% endif %}">{{ t.nav_projects }}</a>
    <a href="{% if page.lang == 'en' %}{{ '/en/#notes' | relative_url }}{% else %}{{ '/#notes' | relative_url }}{% endif %}">{{ t.nav_blog }}</a>
    <a href="#about">{{ t.nav_about }}</a>
    <a class="nav-telegram" href="https://t.me/madducktech">TELEGRAM @MADDUCKTECH ↗</a>
    <a class="nav-github" href="https://github.com/madduck-tech">GITHUB ↗</a>
    <a class="language-switch" data-language-switch href="{{ page.alternate_url | relative_url }}" lang="{% if page.lang == 'en' %}ru{% else %}en{% endif %}" hreflang="{% if page.lang == 'en' %}ru{% else %}en{% endif %}" aria-label="{{ t.language_label }}">{{ t.language_short }}</a>
  </nav>
  <button class="menu" id="menu" type="button" aria-label="{{ t.menu_open }}" aria-controls="site-nav" aria-expanded="false" data-open-label="{{ t.menu_open }}" data-close-label="{{ t.menu_close }}">MENU</button>
</header>
