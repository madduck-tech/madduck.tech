  doom_fly:
    eyebrow: AUTONOMOUS EXPERIMENT / 02
    title: A FLY IN DOOM
    description: A poor fruit fly’s brain is trapped in DOOM, condemned to explore E1M1 forever. The virtual fly receives control signals from an algorithm; the brain diagram on the right is a symbolic visualization of those signals.
    back: Back to madduck.tech
    preview: Read the preview →
    language: RU
    run: Run
    pause: Pause
    reset: Reset
    reset_view: Reset view
    speed: Speed
    stage: E1M1 / HANGAR
    brain: BRAIN / SIGNALS
    state: ACTION
    region: CURRENT SECTOR
    coverage: AREAS VISITED BY THE FLY
    loading: Loading the level and helmet…
    error: The scene could not start. Check your connection and WebGL support, then try again.
    retry: Retry
    drag: Drag horizontally to look around
    keys: Within the scene — Space to pause, R to reset, F to reset the view. The camera always follows the fly. Swipe vertically to scroll the page.
    note_title: A controller, not a real brain
    note: This is an illustrative controller, not a connectome or a learning model. It selects unvisited sectors and sends movement signals. The brain displays those same signals. The fly keeps exploring the map indefinitely. Doors are open; the secret lift operates. Decorative areas behind windows are not part of the route.
    credits: Models by vrchris and DJ_Nugget, CC BY 4.0. The level keeps its original colors; the head was prepared separately. DOOM belongs to its respective rights holders. An unofficial experiment.
    map_credit: E1M1 — vrchris
    helmet_credit: Doom Slayer — DJ_Nugget
    license: CC BY 4.0 license
    states:
      SCAN: Scanning
      PLAN: Planning
      TURN: Turning
      WALK: Walking
      INSPECT: Inspecting
      LIFT: Waiting / riding lift
      RECOVER: Replanning
    signals:
      sensory: Input
      plan: Select
      turn: Turn
      motor: Move
      stop: Stop
  backchannel:
    title: Backchannel — meeting notes on your own computer
    description: Live transcript, summary and action items for every call. Everything runs on your computer.
    nav_tour: Tour
    nav_features: Features
    nav_contact: Contact
    badge: Runs entirely on your computer
    hero_title: Meeting notes that never leave your laptop.
    hero_lead: Live transcript, summary and action items for every call. No cloud, no sign-up.
    hero_alt: A finished meeting — the transcript on the left, the summary with key points and action items on the right
    cta_contact: Contact us
    cta_tour: Take the tour
    tour_title: Four screens, the whole product.
    tour_lead: From the first recording to the summary you send around.
    tour_label: App screens
    tabs:
      - label: Record
        shot: live
        caption: Text arrives while people speak. You on the right, everyone else on the left.
        alt: Recording, the last line still arriving
      - label: Review
        shot: review
        caption: When the call ends — key points and action items, each linked to the moment it was said.
        alt: A finished meeting with its summary
      - label: Choose a model
        shot: models
        caption: Type a language and the list narrows to the models that handle it. Downloaded once, run locally.
        alt: The transcription model catalogue filtered by language
      - label: Choose a summariser
        shot: providers
        caption: The built-in model by default. Ollama, a cloud provider with your own key, Claude Code or Codex when you want them.
        alt: Choosing who writes the summary
    card_local_title: Nothing uploaded
    card_local_text: Transcription and the summary run on the device by default. A cloud provider is used only if you pick one and give it your key.
    card_lang_title: Your language
    card_lang_text: 96 transcription models. Type a language and pick from the ones that handle it.
    card_account_title: No account
    card_account_text: No sign-up and no login. The app works as soon as it is installed.
    contact_title: Want to try Backchannel with your team?
    contact_text: Write to us and we will tell you how to get the app and answer your questions.
    contact_button: Write an email
    contact_subject: Backchannel
    footer: Backchannel · made at Mad Duck
