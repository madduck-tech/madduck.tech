  doom_fly:
    eyebrow: AUTONOMOUS EXPERIMENT / 02
    title: A FLY IN DOOM
    description: A poor fruit fly’s brain is trapped in DOOM, condemned to explore E1M1 forever. The virtual fly receives control signals from an algorithm; the brain diagram on the right is a symbolic visualization of those signals.
    back: Back to madduck.tech
    preview: Read the preview →
    language: RU
    run: Run
    pause: Pause
    reset: Reset
    reset_view: Reset view
    speed: Speed
    stage: E1M1 / HANGAR
    brain: BRAIN / SIGNALS
    state: ACTION
    region: CURRENT SECTOR
    coverage: AREAS VISITED BY THE FLY
    loading: Loading the level and helmet…
    error: The scene could not start. Check your connection and WebGL support, then try again.
    retry: Retry
    drag: Drag horizontally to look around
    keys: Within the scene — Space to pause, R to reset, F to reset the view. The camera always follows the fly. Swipe vertically to scroll the page.
    note_title: A controller, not a real brain
    note: This is an illustrative controller, not a connectome or a learning model. It selects unvisited sectors and sends movement signals. The brain displays those same signals. The fly keeps exploring the map indefinitely. Doors are open; the secret lift operates. Decorative areas behind windows are not part of the route.
    credits: Models by vrchris and DJ_Nugget, CC BY 4.0. The level keeps its original colors; the head was prepared separately. DOOM belongs to its respective rights holders. An unofficial experiment.
    map_credit: E1M1 — vrchris
    helmet_credit: Doom Slayer — DJ_Nugget
    license: CC BY 4.0 license
    states:
      SCAN: Scanning
      PLAN: Planning
      TURN: Turning
      WALK: Walking
      INSPECT: Inspecting
      LIFT: Waiting / riding lift
      RECOVER: Replanning
    signals:
      sensory: Input
      plan: Select
      turn: Turn
      motor: Move
      stop: Stop
