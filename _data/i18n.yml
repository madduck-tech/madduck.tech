  doom_fly:
    eyebrow: АВТОНОМНЫЙ ЭКСПЕРИМЕНТ / 02
    title: МУХА В DOOM
    description: Несчастный мозг дрозофилы оказался в DOOM и теперь обречён бесконечно исследовать E1M1. Виртуальная муха получает управляющие сигналы от алгоритма, а схема мозга справа показывает их условную визуализацию.
    back: На madduck.tech
    preview: Читать тизер →
    language: EN
    run: Запустить
    pause: Пауза
    reset: Сначала
    reset_view: Сбросить ракурс
    speed: Скорость
    stage: E1M1 / HANGAR
    brain: МОЗГ / СИГНАЛЫ
    state: ДЕЙСТВИЕ
    region: ТЕКУЩИЙ СЕКТОР
    coverage: МУХА ПОБЫВАЛА В ОБЛАСТЯХ
    loading: Загружаем уровень и шлем…
    error: Не удалось запустить сцену. Проверьте подключение и поддержку WebGL, затем попробуйте ещё раз.
    retry: Повторить
    drag: Потяните по горизонтали, чтобы осмотреться
    keys: В сцене — пробел для паузы, R для сброса, F для сброса ракурса. Камера всегда следует за мухой. Вертикальный жест прокручивает страницу.
    note_title: Автоматика, не настоящий мозг
    note: Это иллюстративный контроллер, а не коннектом или модель обучения. Он выбирает непосещённые секторы и подаёт сигналы движения. Мозг показывает эти же сигналы. Муха продолжает исследовать карту бесконечно. Двери открыты; секретный подъёмник работает. Декоративные участки за окнами не входят в маршрут.
    credits: Модели — vrchris и DJ_Nugget, CC BY 4.0. Уровень сохранён в исходных цветах; голова подготовлена отдельно. DOOM — собственность соответствующих правообладателей. Неофициальный эксперимент.
    map_credit: E1M1 — vrchris
    helmet_credit: Doom Slayer — DJ_Nugget
    license: Лицензия CC BY 4.0
    states:
      SCAN: Осматривается
      PLAN: Выбирает маршрут
      TURN: Поворачивает
      WALK: Идёт
      INSPECT: Исследует
      LIFT: Ждёт / едет на подъёмнике
      RECOVER: Перестраивает маршрут
    signals:
      sensory: Вход
      plan: Выбор
      turn: Поворот
      motor: Движение
      stop: Стоп

  backchannel:
    title: Backchannel — заметки со встреч на вашем компьютере
    description: Расшифровка в реальном времени, сводка и задачи по каждому звонку. Всё работает на вашем компьютере.
    nav_tour: Экраны
    nav_features: Возможности
    nav_contact: Связаться
    badge: Работает целиком на&nbsp;вашем компьютере
    hero_title: Заметки со&nbsp;встреч, которые не&nbsp;покидают ваш ноутбук.
    hero_lead: Расшифровка в&nbsp;реальном времени, сводка и&nbsp;задачи по&nbsp;каждому звонку. Без облака и&nbsp;без регистрации.
    hero_alt: Завершённая встреча — расшифровка слева, сводка с главным и задачами справа
    cta_contact: Связаться с&nbsp;нами
    cta_tour: Посмотреть экраны
    tour_title: Четыре экрана — весь продукт.
    tour_lead: От первой записи до сводки, которую вы отправляете команде.
    tour_label: Экраны приложения
    tabs:
      - label: Запись
        shot: live
        caption: Текст появляется, пока человек ещё говорит. Ваши реплики справа, собеседников — слева.
        alt: Идёт запись, последняя фраза ещё распознаётся
      - label: Итоги
        shot: review
        caption: После звонка — главное и задачи, и у каждой ссылка на момент, когда это прозвучало.
        alt: Завершённая встреча со сводкой
      - label: Модель расшифровки
        shot: models
        caption: Введите язык — список сузится до моделей, которые его понимают. Модель скачивается один раз и работает локально.
        alt: Каталог моделей расшифровки, отфильтрованный по языку
      - label: Кто пишет сводку
        shot: providers
        caption: По умолчанию — встроенная модель. Ollama, облачный провайдер с вашим ключом, Claude Code или Codex — когда захотите.
        alt: Выбор того, кто пишет сводку
    card_local_title: Ничего не&nbsp;загружается
    card_local_text: Расшифровка и&nbsp;сводки по&nbsp;умолчанию делаются на&nbsp;устройстве. Облачный сервис используется, только если вы&nbsp;сами его выбрали и&nbsp;указали свой ключ.
    card_lang_title: Ваш язык
    card_lang_text: 96 моделей расшифровки, в&nbsp;том числе для русского. Введите язык&nbsp;— останутся те, что с&nbsp;ним работают.
    card_account_title: Без аккаунта
    card_account_text: Не&nbsp;нужно регистрироваться и&nbsp;входить. Приложение работает сразу после установки.
    contact_title: Хотите попробовать Backchannel в&nbsp;своей команде?
    contact_text: Напишите нам&nbsp;— расскажем, как получить приложение, и&nbsp;ответим на&nbsp;вопросы.
    contact_button: Написать письмо
    contact_subject: Backchannel
    footer: Backchannel · сделано в Mad Duck
