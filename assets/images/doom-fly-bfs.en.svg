<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" height="900" role="img" viewBox="0 0 1200 900" width="1200">
  <title id="title">Teaching diagram of a graph and BFS tree</title>
  <desc id="desc">Top: graph with edges AB, AC, BD, BE, CE, DF, EF. Bottom: BFS tree with edges AB, AC, BD, BE, DF and layers 0–3. Route A–B–D–F is highlighted with a thick black line.</desc>
  <rect fill="#F4F2EC" height="900" width="1200" />
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif">
    <text font-size="26" font-weight="700" x="70" y="62">Graph</text>
    <text font-size="26" font-weight="700" x="70" y="457">BFS tree</text>
  </g>
  <rect fill="none" height="337" rx="8" stroke="#B9B9B9" stroke-width="1.5" width="1088" x="56" y="82" />
  <rect fill="none" height="348" rx="8" stroke="#B9B9B9" stroke-width="1.5" width="1088" x="56" y="476" />

  <g fill="none" stroke="#979797" stroke-linecap="round" stroke-width="4">
    <path d="M180 185 V345" />
    <path d="M520 185 V345" />
    <path d="M180 345 H520" />
    <path d="M520 345 H860" />
  </g>
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <path d="M180 185 H520 H860 V345" />
  </g>
  <g dominant-baseline="central" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <circle cx="180" cy="185" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="180" y="185">A</text>
    <circle cx="520" cy="185" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="520" y="185">B</text>
    <circle cx="860" cy="185" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="860" y="185">D</text>
    <circle cx="180" cy="345" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="180" y="345">C</text>
    <circle cx="520" cy="345" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="520" y="345">E</text>
    <circle cx="860" cy="345" fill="#FFD400" r="27" stroke="#000000" stroke-width="3" />
    <text x="860" y="345">F</text>
  </g>

  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">
    <text x="145" y="525">Layer 0</text>
    <text x="425" y="525">Layer 1</text>
    <text x="705" y="525">Layer 2</text>
    <text x="1000" y="525">Layer 3</text>
  </g>
  <g fill="none" stroke="#979797" stroke-linecap="round" stroke-width="4">
    <path d="M145 676 L425 750" />
    <path d="M425 598 L705 660" />
  </g>
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-width="9">
    <path d="M145 676 L425 598 L705 574 L1000 574" />
  </g>
  <g dominant-baseline="central" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <circle cx="145" cy="676" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="145" y="676">A</text>
    <circle cx="425" cy="598" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="425" y="598">B</text>
    <circle cx="425" cy="750" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="425" y="750">C</text>
    <circle cx="705" cy="574" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="705" y="574">D</text>
    <circle cx="705" cy="660" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="705" y="660">E</text>
    <circle cx="1000" cy="574" fill="#F4F2EC" r="27" stroke="#000000" stroke-width="3" />
    <text x="1000" y="574">F</text>
  </g>
  <text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" x="600" y="868">Teaching example: shortest path by edge count</text>
</svg>
