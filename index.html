<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5b82e">
    <meta name="description" content="Mad Duck — что-то любопытное уже плывёт в вашу сторону.">
    <meta property="og:title" content="Mad Duck">
    <meta property="og:description" content="Что-то любопытное уже плывёт в вашу сторону.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://madduck.tech/">
    <meta property="og:image" content="https://madduck.tech/og-image.svg">
    <link rel="canonical" href="https://madduck.tech/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <title>Mad Duck — скоро на воде</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Mad Duck, на главную">
        <span class="brand-mark" aria-hidden="true">MD</span>
        <span>madduck.tech</span>
      </a>
      <span class="status"><span class="status-dot"></span>В разработке</span>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Сохраняйте спокойствие</p>
          <h1>Здесь будет<br><em>что-то кря.</em></h1>
          <p class="lead">Mad Duck готовит место для смелых идей, умных технологий и проектов с характером.</p>
          <a class="github-link" href="https://github.com/kalyaganov/madduck.tech" rel="noreferrer">
            Следить на GitHub
            <span aria-hidden="true">↗</span>
          </a>
        </div>

        <div class="duck-scene" aria-label="Иллюстрация утёнка, плывущего по воде" role="img">
          <div class="sun"></div>
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <svg class="duck" viewBox="0 0 520 430" aria-hidden="true">
            <path class="duck-shadow" d="M73 358c84-34 291-36 382 2-47 37-325 39-382-2Z"/>
            <path class="duck-body" d="M100 297c22-49 91-65 151-50 27 7 57 14 87 1 33-15 75-3 95 28 32 50-18 94-83 102-98 13-282 4-250-81Z"/>
            <path class="duck-wing" d="M184 271c45-17 106 4 128 42-36 23-102 25-141-9 0-14 4-25 13-33Z"/>
            <path class="duck-neck" d="M329 269c-21-31-19-75-6-111l61 2c4 42-2 91-23 119Z"/>
            <circle class="duck-head" cx="355" cy="132" r="72"/>
            <path class="duck-beak" d="M402 123c38-8 72 4 87 22-18 27-63 29-91 12-5-13-3-24 4-34Z"/>
            <circle class="duck-eye" cx="375" cy="110" r="8"/>
            <circle class="duck-eye-glint" cx="378" cy="107" r="2.5"/>
            <path class="duck-brow" d="M354 88c12-8 28-8 39 0"/>
            <path class="duck-detail" d="M205 290c25 24 57 31 91 25M115 326c31 19 68 24 107 20"/>
          </svg>
          <div class="water-line line-one"></div>
          <div class="water-line line-two"></div>
          <p class="scene-note">Ожидайте<br>неожиданного</p>
        </div>
      </section>
    </main>

    <footer>
      <span>© 2026 Mad Duck</span>
      <span>Made with feathers &amp; code</span>
    </footer>
  </body>
</html>
